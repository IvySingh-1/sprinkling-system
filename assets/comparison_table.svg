<svg viewBox="0 0 800 226" xmlns="http://www.w3.org/2000/svg">
  <style>
    .text-header { fill: #F1EDE6; font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: bold; }
    .text-title { fill: #3A2D28; font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: bold; }
    .text-body { fill: #3A2D28; font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; }
    .text-smart { fill: #A48374; font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: bold; }
    .col-line { stroke: #D1C7BD; stroke-width: 1; }
    .row-line { stroke: #D1C7BD; stroke-width: 1; }
  </style>

  <clipPath id="table-clip">
    <rect x="0" y="0" width="800" height="226" rx="8" ry="8" />
  </clipPath>

  <g clip-path="url(#table-clip)">
    <!-- Header Row (y: 0 to 46) -->
    <rect x="0" y="0" width="800" height="46" fill="#3A2D28" />
    
    <!-- Row 1 (y: 46 to 91) -->
    <rect x="0" y="46" width="800" height="45" fill="#F1EDE6" />
    
    <!-- Row 2 (y: 91 to 136) -->
    <rect x="0" y="91" width="800" height="45" fill="#EBE3DB" />
    
    <!-- Row 3 (y: 136 to 181) -->
    <rect x="0" y="136" width="800" height="45" fill="#F1EDE6" />
    
    <!-- Row 4 (y: 181 to 226) -->
    <rect x="0" y="181" width="800" height="45" fill="#EBE3DB" />

    <!-- Column Grid Lines -->
    <line x1="200" y1="0" x2="200" y2="226" class="col-line" />
    <line x1="500" y1="0" x2="500" y2="226" class="col-line" />

    <!-- Row Grid Lines -->
    <line x1="0" y1="46" x2="800" y2="46" class="row-line" />
    <line x1="0" y1="91" x2="800" y2="91" class="row-line" />
    <line x1="0" y1="136" x2="800" y2="136" class="row-line" />
    <line x1="0" y1="181" x2="800" y2="181" class="row-line" />

    <!-- Text Contents -->
    <!-- Header -->
    <text x="20" y="27" class="text-header">Feature</text>
    <text x="220" y="27" class="text-header">Traditional Sprinkling</text>
    <text x="520" y="27" class="text-header">AirOptima Smart System</text>

    <!-- Row 1 -->
    <text x="20" y="73" class="text-title">Deployment Trigger</text>
    <text x="220" y="73" class="text-body">Scheduled (Blind to active pollution types)</text>
    <text x="520" y="73" class="text-smart">AI Classification (Dust vs. Combustion)</text>

    <!-- Row 2 -->
    <text x="20" y="118" class="text-title">Water Conservation</text>
    <text x="220" y="118" class="text-body">0% (Uniform water drain)</text>
    <text x="520" y="118" class="text-smart">68.5% Water Saved Daily</text>

    <!-- Row 3 -->
    <text x="20" y="163" class="text-title">Safety Integration</text>
    <text x="220" y="163" class="text-body">None (Spraying continues in high winds)</text>
    <text x="520" y="163" class="text-smart">Wind speed &amp; Direction checks</text>

    <!-- Row 4 -->
    <text x="20" y="208" class="text-title">Fleet Coordination</text>
    <text x="220" y="208" class="text-body">Fixed static routes</text>
    <text x="520" y="208" class="text-smart">Dynamic TomTom Traffic Routing</text>
  </g>

  <!-- Outer Border -->
  <rect x="0.5" y="0.5" width="799" height="225" rx="8" ry="8" fill="none" stroke="#D1C7BD" stroke-width="1" />
</svg>
