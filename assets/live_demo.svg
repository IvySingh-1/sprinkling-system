<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 46" width="240" height="46">
  <style>
    .btn-bg {
      fill: #3A2D28;
      stroke: #CBAD8D;
      stroke-width: 1.5;
      rx: 8px;
    }
    .label {
      font-family: 'JetBrains Mono', monospace, sans-serif;
      font-size: 11px;
      font-weight: 700;
      fill: #F1EDE6;
      letter-spacing: 1.5px;
    }
    .sub {
      font-family: 'Segoe UI', sans-serif;
      font-size: 11px;
      fill: #CBAD8D;
    }
    .glow-dot {
      fill: #CBAD8D;
    }
  </style>

  <!-- Button Card -->
  <rect x="1" y="1" width="238" height="44" class="btn-bg" />

  <!-- Glowing Pulse Dot -->
  <circle cx="28" cy="23" r="5" class="glow-dot">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
    <animate attributeName="r" values="4.5;6;4.5" dur="2s" repeatCount="indefinite" />
  </circle>

  <!-- Button Text -->
  <text x="46" y="27" class="label">LAUNCH LIVE DEMO</text>
  
  <!-- Arrow -->
  <text x="210" y="27" class="sub" font-weight="bold">➔</text>
</svg>
