services:
  # Python Flask Machine Learning Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - .env
    restart: always

  # Nginx Web Server for the static HTML/JS/CSS GIS Dashboard
  frontend:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      # Mount static files directly to Nginx web root for instant hot-reloads during development
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./script.js:/usr/share/nginx/html/script.js:ro
      - ./style.css:/usr/share/nginx/html/style.css:ro
      - ./assets:/usr/share/nginx/html/assets:ro
    restart: always
